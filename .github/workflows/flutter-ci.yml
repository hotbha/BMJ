name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'lush/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'lush/**'

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd lush
          flutter pub get

      - name: Analyze Dart code
        run: |
          cd lush
          flutter analyze --fatal-infos

      - name: Run unit tests
        run: |
          cd lush
          flutter test --coverage --reporter expanded 2>&1 | tee test_output.txt

      - name: Validate test count (expected 368)
        run: |
          cd lush
          TEST_LINE=$(grep 'All tests passed' test_output.txt)
          ACTUAL=$(echo "$TEST_LINE" | sed 's/.*+\([0-9]*\).*/\1/')
          EXPECTED=368
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "❌ Test count mismatch: got $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          echo "✅ All $ACTUAL tests passed (matches expected $EXPECTED)"

      - name: Check coverage ≥ 80%
        run: |
          cd lush
          COV=$(lcov --summary coverage/lcov.info 2>&1 | grep 'lines' | awk '{print $2}' | sed 's/%//')
          if [ -z "$COV" ]; then
            echo "❌ Could not determine coverage"
            exit 1
          fi
          if awk "BEGIN{exit !($COV < 80)}"; then
            echo "❌ Coverage ${COV}% < 80%"
            exit 1
          fi
          echo "✅ Coverage ${COV}% ≥ 80%"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: lush/coverage/

      - name: Build APK (debug)
        run: |
          cd lush
          flutter build apk --debug \
            --dart-define=SENTRY_DSN_FLUTTER=${{ secrets.SENTRY_DSN_FLUTTER || '' }} \
            --dart-define=SENTRY_ENVIRONMENT=ci

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: lush/build/app/outputs/flutter-apk/*.apk
