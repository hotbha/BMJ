</button>

<button class="text-primary font-bold hover:opacity-80 transition-opacity disabled:opacity-50 disabled:cursor-not-allowed" id="resend-btn" disabled="">

</button>

<script>
        // OTP Input Auto-advance logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simple Countdown Timer
        let timeLeft = 30;
        const timerElement = document.getElementById('timer');
        const resendBtn = document.getElementById('resend-btn');

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = `(0:${timeLeft.toString().padStart(2, '0')})`;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.textContent = '';
                resendBtn.disabled = false;
            }
        }, 1000);
    </script>
