<nav class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between p-md max-w-max-width-container mx-auto">
<button class="w-12 h-12 flex items-center justify-center rounded-full glass-panel text-on-surface-variant hover:text-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-display-md text-display-md text-primary-container tracking-tighter">

<div class="w-12 h-12"></div> <!-- Spacer for balance -->
</nav>
<!-- Main Content Canvas -->

</div>

<div class="w-24 h-24 rounded-full overflow-hidden border-2 border-primary-container shadow-[0_0_20px_rgba(249,115,22,0.3)] z-10 relative">

                Welcome, Alex!
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-8 px-sm">
                One last step! Please provide your phone number to complete your registration and start booking your juice.
            </p>
<!-- Phone Form -->
<form class="w-full space-y-6">
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface-variant block ml-1" for="phone">Phone Number</label>
<div class="flex relative">

<button class="absolute left-0 top-0 bottom-0 px-4 flex items-center justify-center input-field rounded-l-lg border-r-0 border-white/10 text-on-surface hover:bg-surface-variant transition-colors group" type="button">
<span class="mr-1">🇺🇸</span>
<span class="font-body-md text-body-md mr-1">+1</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant group-hover:text-primary transition-colors" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</button>
<!-- Input -->
<input class="w-full input-field rounded-lg h-14 pl-[110px] pr-4 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0" id="phone" name="phone" placeholder="(555) 000-0000" type="tel"/>

<p class="font-label-sm text-label-sm text-on-surface-variant/60 ml-1 mt-1">

                    </p>

<span>Complete Signup</span>
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
</button>
</form>

<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-colors underline decoration-white/20 underline-offset-4">
