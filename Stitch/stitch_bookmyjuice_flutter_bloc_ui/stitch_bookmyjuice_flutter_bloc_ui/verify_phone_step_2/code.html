<script>
        document.addEventListener('DOMContentLoaded', () => {
            const sendOtpBtn = document.getElementById('sendOtpBtn');
            const otpSection = document.getElementById('otpSection');
            const phoneInput = document.getElementById('phoneNumber');
            const timerSpan = document.getElementById('timer');
            const resendBtn = document.getElementById('resendBtn');
            const otpInputs = otpSection.querySelectorAll('input[type="text"]');
            let timeLeft = 30;
            let timerId;

            // Handle Send OTP
            sendOtpBtn.addEventListener('click', () => {
                if(phoneInput.value.trim().length > 5) {
                    sendOtpBtn.classList.add('opacity-50', 'pointer-events-none');
                    sendOtpBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Sending...';
                    
                    // Simulate API Call
                    setTimeout(() => {
                        sendOtpBtn.style.display = 'none';
                        otpSection.classList.remove('hidden');
                        otpInputs[0].focus();
                        startTimer();
                    }, 800);
                } else {
                    phoneInput.parentElement.classList.add('border-error');
                    setTimeout(() => phoneInput.parentElement.classList.remove('border-error'), 1000);
                }
            });

            // Handle OTP Input Auto-advance
            otpInputs.forEach((input, index) => {
                input.addEventListener('input', function() {
                    if (this.value.length === 1) {
                        if (index < otpInputs.length - 1) {
                            otpInputs[index + 1].focus();
                        }
                    }
                });
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value.length === 0) {
                        if (index > 0) {
                            otpInputs[index - 1].focus();
                        }
                    }
                });
            });

            // Timer Logic
            function startTimer() {
                timeLeft = 30;
                resendBtn.disabled = true;
                resendBtn.innerHTML = `Resend in <span id="timer">${timeLeft}</span>s`;
                
                timerId = setInterval(() => {
                    timeLeft--;
                    const tSpan = document.getElementById('timer');
                    if(tSpan) tSpan.textContent = timeLeft;
                    
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        resendBtn.disabled = false;
                        resendBtn.innerHTML = 'Resend OTP';
                    }
                }, 1000);
            }

            resendBtn.addEventListener('click', () => {
                startTimer();
                // Simulate resend
            });
        });
    </script>
