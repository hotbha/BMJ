<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface/80 backdrop-blur-xl docked full-width top-0 sticky border-b border-white/10 shadow-sm z-50">
<div class="max-w-[430px] mx-auto flex justify-between items-center px-md py-sm">
<button class="text-primary-container dark:text-primary hover:opacity-80 transition-opacity active:scale-95 duration-200">

<h1 class="font-display-md text-display-md text-primary-container tracking-tighter">Book My Juice</h1>
<div class="w-6"></div> <!-- Spacer for balance -->
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow w-full max-w-max-width-container mx-auto px-margin-mobile md:px-margin-desktop py-lg relative flex flex-col justify-center min-h-[calc(100vh-64px)]">
<!-- Decorative Background Elements -->

<div class="absolute top-[-10%] left-[-20%] w-[300px] h-[300px] rounded-full bg-primary-container/20 blur-[100px]"></div>

</div>
<div class="glass-panel rounded-xl p-lg w-full relative" id="signup-container">
<!-- Step 1: Email & Password -->

<div class="text-center mb-xl">
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Create Account</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Join the vitalizing wellness platform.</p>
</div>
<form class="space-y-md" id="form-step1">
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-base uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="input-glass w-full rounded-lg py-sm pl-[40px] pr-sm font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/50" id="email" placeholder="zesty@example.com" required="" type="email"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-base uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="input-glass w-full rounded-lg py-sm pl-[40px] pr-sm font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/50" id="password" minlength="8" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary-container transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
<p class="mt-2 font-label-sm text-label-sm text-on-surface-variant/70">Must be at least 8 characters.</p>
</div>
<button class="btn-primary w-full rounded-full py-sm px-lg font-label-lg text-label-lg text-on-primary-container mt-lg flex items-center justify-center gap-sm" onclick="nextStep()" type="button">
                        Continue
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">Already have an account? <a class="text-primary-container hover:underline font-title-lg text-[14px]" href="#">Log in</a></p>
</div>
</div>

<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="text-center mb-xl mt-sm">
<div class="w-16 h-16 mx-auto bg-surface-variant rounded-full flex items-center justify-center mb-md border border-white/10">

<input autocomplete="off" class="w-12 h-14 input-glass rounded-lg text-center font-display-md text-display-md text-on-surface p-0" maxlength="1" type="text"/>
<input autocomplete="off" class="w-12 h-14 input-glass rounded-lg text-center font-display-md text-display-md text-on-surface p-0" maxlength="1" type="text"/>
<input autocomplete="off" class="w-12 h-14 input-glass rounded-lg text-center font-display-md text-display-md text-on-surface p-0" maxlength="1" type="text"/>
<input autocomplete="off" class="w-12 h-14 input-glass rounded-lg text-center font-display-md text-display-md text-on-surface p-0" maxlength="1" type="text"/>
<input autocomplete="off" class="w-12 h-14 input-glass rounded-lg text-center font-display-md text-display-md text-on-surface p-0" maxlength="1" type="text"/>
</div>
<button class="btn-primary w-full rounded-full py-sm px-lg font-label-lg text-label-lg text-on-primary-container mt-lg flex items-center justify-center gap-sm" type="button">
                        Verify &amp; Continue
                    </button>
</form>
<div class="mt-lg text-center flex flex-col items-center">
<p class="font-body-md text-body-md text-on-surface-variant mb-xs">Didn't receive the code?</p>
<button class="font-label-lg text-label-lg text-primary-container disabled:text-on-surface-variant/50 disabled:cursor-not-allowed transition-colors" disabled="" id="resend-btn">
                        Resend in <span id="timer">0:30</span>
</button>
</div>

</main>
<!-- Suppressed BottomNavBar & FAB as per rules for linear/transactional intent -->
<script>
        // Basic Navigation Logic
        function nextStep() {
            const emailInput = document.getElementById('email').value;
            if(emailInput) {
                document.getElementById('display-email').innerText = emailInput;
                document.getElementById('step1').classList.remove('active');
                setTimeout(() => document.getElementById('step2').classList.add('active'), 50);
                startTimer();
                setupOtpInputs();
            }
        }

        function prevStep() {
            document.getElementById('step2').classList.remove('active');
            setTimeout(() => document.getElementById('step1').classList.add('active'), 50);
        }

        // OTP Input Logic
        function setupOtpInputs() {
            const inputs = document.querySelectorAll('#otp-container input');
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
            if(inputs.length > 0) inputs[0].focus();
        }

        // Timer Logic
        let timerInterval;
        function startTimer() {
            clearInterval(timerInterval);
            let timeLeft = 30;
            const timerDisplay = document.getElementById('timer');
            const resendBtn = document.getElementById('resend-btn');
            
            resendBtn.disabled = true;
            timerDisplay.parentElement.classList.add('disabled:text-on-surface-variant/50');
            
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `0:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = '';
                    resendBtn.innerHTML = 'Resend Code';
                    resendBtn.disabled = false;
                }
            }, 1000);
        }
    </script>
