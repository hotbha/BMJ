<style>
        .glass-panel {
            background: rgba(41, 29, 22, 0.6);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-dark {
            background: #1c211e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f6ded3;
        }

            border-color: #f97316;
            outline: none;
            box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2);

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md overflow-hidden relative">
<!-- Abstract Background Element -->
<div class="absolute inset-0 z-0 opacity-30 pointer-events-none" style="background: radial-gradient(circle at 50% -20%, rgba(249,115,22,0.3) 0%, rgba(28,17,11,0) 60%);"></div>
<div class="w-full max-w-max-width-container px-margin-mobile z-10 relative">
<!-- Header area (Transactional, no global nav) -->
<header class="mb-xl text-center">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full glass-panel mb-sm shadow-[0_0_30px_rgba(249,115,22,0.2)]">
<span class="material-symbols-outlined text-primary-container text-display-lg" data-icon="lock_open">lock_open</span>
</div>
<h1 class="font-display-md text-display-md text-on-surface mb-xs">Secure Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create a strong password to protect your Book My Juice profile.</p>
</header>
<!-- Main Form Content -->
<main class="glass-panel rounded-xl p-lg flex flex-col gap-lg shadow-lg">
<!-- New Password Field -->
<div class="flex flex-col gap-sm relative">
<label class="font-label-lg text-label-lg text-on-surface" for="new-password">New Password</label>
<div class="relative">
<input class="input-dark w-full h-12 rounded-lg px-md font-body-lg text-body-lg pr-12 transition-colors" id="new-password" placeholder="Enter new password" type="password"/>
<button class="absolute right-0 top-0 bottom-0 px-md flex items-center justify-center text-on-surface-variant hover:text-primary-container transition-colors focus:outline-none" onclick="togglePasswordVisibility('new-password', 'icon-new-password')" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="icon-new-password">visibility</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="flex flex-col gap-xs mt-1">
<div class="flex h-1 gap-1 w-full rounded-full overflow-hidden">
<div class="flex-1 bg-surface-container-highest h-full rounded-full transition-all duration-300" id="strength-1"></div>
<div class="flex-1 bg-surface-container-highest h-full rounded-full transition-all duration-300" id="strength-2"></div>
<div class="flex-1 bg-surface-container-highest h-full rounded-full transition-all duration-300" id="strength-3"></div>
<div class="flex-1 bg-surface-container-highest h-full rounded-full transition-all duration-300" id="strength-4"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant text-right" id="strength-text">Weak</span>
</div>
</div>
<!-- Confirm Password Field -->
<div class="flex flex-col gap-sm relative">
<label class="font-label-lg text-label-lg text-on-surface" for="confirm-password">Confirm Password</label>
<div class="relative">
<input class="input-dark w-full h-12 rounded-lg px-md font-body-lg text-body-lg pr-12 transition-colors" id="confirm-password" placeholder="Re-enter password" type="password"/>
<button class="absolute right-0 top-0 bottom-0 px-md flex items-center justify-center text-on-surface-variant hover:text-primary-container transition-colors focus:outline-none" onclick="togglePasswordVisibility('confirm-password', 'icon-confirm-password')" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="icon-confirm-password">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="mt-md w-full h-14 bg-primary-container text-white font-title-lg text-title-lg rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(249,115,22,0.45)] hover:opacity-90 active:scale-95 transition-all duration-200">
                Set Password &amp; Start
            </button>
<div class="text-center mt-2">
<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-primary-container transition-colors">Cancel</button>
</div>
</main>
</div>
<script>
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Simple mock strength indicator logic
        const passwordInput = document.getElementById('new-password');
        const strengthBars = [
            document.getElementById('strength-1'),
            document.getElementById('strength-2'),
            document.getElementById('strength-3'),
            document.getElementById('strength-4')
        ];
        const strengthText = document.getElementById('strength-text');

        passwordInput.addEventListener('input', function() {
            const val = this.value;
            let score = 0;
            
            if(val.length > 0) score++;
            if(val.length >= 8) score++;
            if(/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
            if(/[^A-Za-z0-9]/.test(val)) score++;

            // Reset bars
            strengthBars.forEach(bar => {
                bar.className = 'flex-1 bg-surface-container-highest h-full rounded-full transition-all duration-300';
            });

            // Update based on score
            if (score > 0) {
                strengthBars[0].classList.replace('bg-surface-container-highest', 'bg-error');
                strengthText.textContent = 'Weak';
                strengthText.className = 'font-label-sm text-label-sm text-error text-right';
            }
            if (score > 1) {
                strengthBars[0].classList.replace('bg-error', 'bg-primary');
                strengthBars[1].classList.replace('bg-surface-container-highest', 'bg-primary');
                strengthText.textContent = 'Fair';
                strengthText.className = 'font-label-sm text-label-sm text-primary text-right';
            }
            if (score > 2) {
                strengthBars[0].classList.replace('bg-primary', 'bg-secondary');
                strengthBars[1].classList.replace('bg-primary', 'bg-secondary');
                strengthBars[2].classList.replace('bg-surface-container-highest', 'bg-secondary');
                strengthText.textContent = 'Good';
                strengthText.className = 'font-label-sm text-label-sm text-secondary text-right';
            }
            if (score > 3) {
                strengthBars[3].classList.replace('bg-surface-container-highest', 'bg-neon-lime');
                 strengthBars[0].classList.replace('bg-secondary', 'bg-neon-lime');
                strengthBars[1].classList.replace('bg-secondary', 'bg-neon-lime');
                strengthBars[2].classList.replace('bg-secondary', 'bg-neon-lime');
                strengthText.textContent = 'Strong';
                strengthText.className = 'font-label-sm text-label-sm text-neon-lime text-right';
            }
            if(score === 0) {
                 strengthText.textContent = 'Enter password';
                 strengthText.className = 'font-label-sm text-label-sm text-on-surface-variant text-right';
            }
        });
    </script>
</body></html>
