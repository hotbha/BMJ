<!DOCTYPE html><html class="dark" lang="en"><head>

            box-shadow: 0 0 0 1px #f97316;
        }
        
        /* Glassmorphism utilities */

            background: rgba(41, 29, 22, 0.6); /* surface-container with opacity */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

                        "on-secondary-container": "#004119",

                        "on-surface-bright": "#dfe4e0",

                        "zest-glow": "rgba(249, 115, 22, 0.45)",
                        "primary-fixed": "#ffdbca",

                        "tertiary": "#5dd9d0",
                        "surface-container": "#291d16",

                        "on-secondary-fixed": "#002109",
                        "surface-tint": "#ffb690",
                        "surface-variant": "#40322a",
                        "secondary-fixed-dim": "#4ae176",
                        "background": "#1c110b",
                        "primary": "#ffb690",
                        "on-error-container": "#ffdad6",
                        "secondary-container": "#00b954",
                        "on-tertiary": "#003734",
                        "outline": "#a78b7d",

                        "tertiary-fixed-dim": "#5dd9d0",

                        "on-background": "#f6ded3",

<body class="bg-background text-on-background min-h-screen flex flex-col items-center antialiased overflow-x-hidden selection:bg-primary-container selection:text-white">
<!-- Ambient Background Glow -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-container/20 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary-container/10 blur-[100px] rounded-full"></div>
</div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-max-width-container mx-auto min-h-screen flex flex-col px-margin-mobile pt-16 pb-8">
<!-- Back Button (Transactional context, no shell nav) -->
<div class="flex items-center mb-8">
<button class="w-12 h-12 flex items-center justify-center rounded-full glass-panel text-on-surface hover:text-primary-container transition-colors active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<!-- Header Section -->
<div class="flex flex-col gap-sm mb-12">
<div class="w-16 h-16 rounded-2xl bg-surface-container flex items-center justify-center mb-4 border border-white/10 shadow-[0_4px_24px_rgba(249,115,22,0.15)] relative overflow-hidden">
<div class="absolute inset-0 bg-primary-container/10"></div>
<span class="material-symbols-outlined text-[32px] text-primary-container">lock</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface">Verify Your<br>Number</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">
                We've sent a 6-digit code to<br>
<span class="font-label-lg text-label-lg text-on-surface">+91 98765 43210</span>
</p>
</div>
<!-- OTP Input Form -->
<form class="flex flex-col flex-1" onsubmit="event.preventDefault();">
<!-- 6-Digit Grid -->
<div class="grid grid-cols-6 gap-2 mb-8">
<!-- Input 1 -->
<input aria-label="Digit 1" class="otp-input w-full aspect-[3/4] bg-surface-container-highest border border-white/10 rounded-xl text-center font-headline-lg text-headline-lg text-on-surface transition-all focus:bg-surface" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<!-- Input 2 -->
<input aria-label="Digit 2" class="otp-input w-full aspect-[3/4] bg-surface-container-highest border border-white/10 rounded-xl text-center font-headline-lg text-headline-lg text-on-surface transition-all focus:bg-surface" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<!-- Input 3 -->
<input aria-label="Digit 3" class="otp-input w-full aspect-[3/4] bg-surface-container-highest border border-white/10 rounded-xl text-center font-headline-lg text-headline-lg text-on-surface transition-all focus:bg-surface" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<!-- Input 4 -->
<input aria-label="Digit 4" class="otp-input w-full aspect-[3/4] bg-surface-container-highest border border-white/10 rounded-xl text-center font-headline-lg text-headline-lg text-on-surface transition-all focus:bg-surface" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<!-- Input 5 -->
<input aria-label="Digit 5" class="otp-input w-full aspect-[3/4] bg-surface-container-highest border border-white/10 rounded-xl text-center font-headline-lg text-headline-lg text-on-surface transition-all focus:bg-surface" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
<!-- Input 6 -->
<input aria-label="Digit 6" class="otp-input w-full aspect-[3/4] bg-surface-container-highest border border-white/10 rounded-xl text-center font-headline-lg text-headline-lg text-on-surface transition-all focus:bg-surface" inputmode="numeric" maxlength="1" pattern="[0-9]*" type="text">
</div>
<!-- Resend Logic -->
<div class="flex items-center justify-center gap-2 mb-auto">
<span class="font-body-md text-body-md text-on-surface-variant">Didn't receive the code?</span>
<button class="font-label-lg text-label-lg text-primary-container hover:opacity-80 transition-opacity">
                    Resend (00:45)
                </button>
</div>
<!-- Action Button -->
<div class="mt-8">
<button class="w-full h-14 bg-primary-container text-white rounded-xl font-label-lg text-label-lg shadow-[0_0_24px_rgba(249,115,22,0.45)] hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Verify &amp; Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
</main>
<script>
        // Auto-focus next input logic for OTP
        const inputs = document.querySelectorAll('.otp-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1) {
                    if (index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '') {
                    if (index > 0) {
                        inputs[index - 1].focus();
                    }
                }
            });
        });
        
        // Focus first input on load
        if(inputs.length > 0) {
            setTimeout(() => inputs[0].focus(), 100);
        }
    </script>
</body></html>
