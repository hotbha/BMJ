<style>
        .glass-panel {
            background: rgba(41, 29, 22, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

            background-color: #1c211e; /* Deep charcoal as per style guide, overriding theme surface for input specific */

<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col items-center justify-start overflow-x-hidden pt-safe pb-safe">
<!-- Top App Bar (Modified for transactional flow - back button instead of menu) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl dark:bg-surface-dim/80 shadow-sm border-b border-white/10 flex items-center justify-between px-margin-mobile h-16 max-w-[430px] mx-auto">
<button aria-label="Go back" class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center w-12 h-12" onclick="window.location.href='{{DATA:SCREEN:SCREEN_11}}'">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="font-display-md text-display-md font-extrabold text-primary tracking-tighter">BookMyJuice</div>
<div class="w-12 h-12"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-max-width-container mx-auto px-margin-mobile pt-24 pb-32 flex flex-col gap-lg flex-1 relative z-10">
<!-- Progress Indicator -->
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center text-label-sm font-label-sm text-on-surface-variant uppercase tracking-wider"><span class="">Steps 1-2 Completed</span>
<span class="">Step 3: Password</span></div>
<div class="w-full h-1 bg-surface-container rounded-full overflow-hidden flex"><div class="h-full bg-secondary w-1/3"></div>
<div class="h-full bg-secondary w-1/3 border-l border-surface"></div>
<div class="h-full bg-primary-container w-1/3 border-l border-surface relative">
<div class="absolute inset-0 bg-white/20 animate-pulse"></div>
</div></div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mt-sm">Secure Your Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create a strong password to protect your account and order history.</p>
</div>
<!-- Map Preview -->
<!-- Address Form -->
<form class="flex flex-col gap-lg" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="password">Enter Password</label>
<div class="relative">
<input class="input-field w-full h-12 rounded-lg px-md font-body-md text-body-md placeholder-on-surface-variant/50" id="password" name="password" placeholder="••••••••" required="" type="password">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant cursor-pointer">visibility</span>
</div>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="confirm_password">Confirm Password</label>
<input class="input-field w-full h-12 rounded-lg px-md font-body-md text-body-md placeholder-on-surface-variant/50" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password">
</div>
</div>
<div class="glass-panel rounded-xl p-md flex flex-col gap-sm">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-xs">Password Strength</span>
<div class="flex flex-col gap-xs">
<div class="flex items-center gap-sm text-on-surface-variant" id="crit-length">
<span class="material-symbols-outlined text-[18px]">circle</span>
<span class="text-body-md">At least 8 characters</span>
</div>
<div class="flex items-center gap-sm text-on-surface-variant" id="crit-upper">
<span class="material-symbols-outlined text-[18px]">circle</span>
<span class="text-body-md">Contains an uppercase letter</span>
</div>
<div class="flex items-center gap-sm text-on-surface-variant" id="crit-number">
<span class="material-symbols-outlined text-[18px]">circle</span>
<span class="text-body-md">Contains a number</span>
</div>
<div class="flex items-center gap-sm text-on-surface-variant" id="crit-special">
<span class="material-symbols-outlined text-[18px]">circle</span>
<span class="text-body-md">Contains a special character</span>
</div>
</div>
</div>
</form>
</main>
<!-- Fixed Bottom Action Bar -->
<div class="fixed bottom-0 w-full max-w-max-width-container mx-auto z-50 bg-surface/90 backdrop-blur-2xl border-t border-white/10 p-margin-mobile pb-safe shadow-[0_-8px_32px_rgba(0,0,0,0.4)]">
<button class="w-full h-14 rounded-xl bg-primary-container text-white font-title-lg text-title-lg flex items-center justify-center gap-sm shadow-[0_0_24px_rgba(249,115,22,0.45)] hover:bg-primary-container/90 active:scale-[0.98] transition-all relative overflow-hidden group opacity-50" onclick="window.location.href='{{DATA:SCREEN:SCREEN_20}}'">
<span class="relative z-10">Complete Setup</span>
<span class="material-symbols-outlined relative z-10" style="font-variation-settings: &quot;FILL&quot; 1;">check_circle</span>
<div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/20 to-transparent translate-x-[-100%] group-hover:animate-[shimmer_1.5s_infinite]"></div>
</button>
</div>
<style>
        @keyframes shimmer {
            100% {
                transform: translateX(100%);
            }
        }
    </style>
<script>
        // Simple script to handle input focus states if needed for specific aesthetic tweaks, though CSS handles most.
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', (e) => {
                e.target.parentElement.querySelector('label').classList.replace('text-on-surface-variant', 'text-primary-container');
            });
            input.addEventListener('blur', (e) => {
                e.target.parentElement.querySelector('label').classList.replace('text-primary-container', 'text-on-surface-variant');
            });
        });
    </script>
