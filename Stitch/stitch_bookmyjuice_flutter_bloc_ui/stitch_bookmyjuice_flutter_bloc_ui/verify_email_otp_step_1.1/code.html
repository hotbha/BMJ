<!-- Lightweight JS for OTP Input Logic (Auto-advance) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('#otp-form input[type="number"]');
            
            inputs.forEach((input, index) => {
                // Handle input sequence
                input.addEventListener('input', (e) => {
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1); // Keep only first char
                    }
                    if (e.target.value.length === 1) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        } else {
                            input.blur(); // Dismiss keyboard on last input
                        }
                        // Add active glow state visually
                        e.target.classList.add('border-primary-container', 'shadow-zest-glow');
                        e.target.classList.remove('border-outline-variant');
                    } else if (e.target.value.length === 0) {
                        // Remove glow
                        e.target.classList.remove('border-primary-container', 'shadow-zest-glow');
                        e.target.classList.add('border-outline-variant');
                    }
                });

                // Handle backspace navigation
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
                
                // Focus styling
                input.addEventListener('focus', (e) => {
                    e.target.classList.add('border-primary-container');
                });
                input.addEventListener('blur', (e) => {
                    if(e.target.value === '') {
                        e.target.classList.remove('border-primary-container');
                    }
                });
            });
        });
    </script>
