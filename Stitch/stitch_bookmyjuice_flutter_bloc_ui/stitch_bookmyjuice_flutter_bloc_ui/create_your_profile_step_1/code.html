<body class="font-body-md bg-surface text-on-surface p-margin-mobile">
<div class="w-full max-w-max-width-container mx-auto flex flex-col gap-lg">

<h1 class="font-display-md text-display-md font-extrabold text-primary tracking-tighter">BookMyJuice</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">Create your account to start your wellness journey.</p>
</header>
<!-- Stepper -->

<div class="absolute left-md right-md top-1/2 -translate-y-1/2 h-[2px] bg-surface-variant z-0 rounded-full"></div>
<div class="relative z-10 flex flex-col items-center gap-xs">
<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-lg text-label-lg shadow-[0_0_15px_rgba(249,115,22,0.45)]">
                    1
                </div>
<span class="font-label-sm text-label-sm text-primary">Name+Email</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-xs opacity-50">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-label-lg text-label-lg">
                    2
                </div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Phone</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-xs opacity-50">
<div class="w-8 h-8 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-label-lg text-label-lg">
                    3
                </div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Password</span>
</div>
</div>
<div class="text-center font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">
            Step 1 of 3
        </div>
<!-- Form Panel -->
<div class="glass-panel rounded-xl p-md flex flex-col gap-lg shadow-lg">
<!-- Profile Picture Upload -->
<div class="flex flex-col items-center gap-sm">
<div class="relative w-24 h-24 rounded-full bg-surface-container-high border border-dashed border-outline-variant flex items-center justify-center overflow-hidden cursor-pointer hover:border-primary transition-colors group">
<span class="material-symbols-outlined text-[32px] text-on-surface-variant group-hover:text-primary transition-colors">add_a_photo</span>
<input accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" type="file">
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Profile Picture (Optional)</span>
</div>
<!-- Inputs -->
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="fullName">Full Name <span class="text-primary-container">*</span></label>
<input class="input-glass rounded-lg px-sm py-3 text-on-surface font-body-md text-body-md w-full placeholder:text-on-surface-variant/50" id="fullName" placeholder="Jane Doe" type="text">
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="email">Email Address <span class="text-primary-container">*</span></label>
<input class="input-glass rounded-lg px-sm py-3 text-on-surface font-body-md text-body-md w-full placeholder:text-on-surface-variant/50" id="email" placeholder="jane@example.com" type="email">
</div>
</div>
