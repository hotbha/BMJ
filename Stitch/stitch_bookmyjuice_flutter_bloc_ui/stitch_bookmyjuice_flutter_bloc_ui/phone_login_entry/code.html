<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased overflow-x-hidden">
<!-- Top Navigation Shell (Suppressed for Transactional Intent, replaced with standard Back Nav) -->
<header class="w-full max-w-max-width-container mx-auto flex items-center px-md py-lg z-50 sticky top-0 bg-background/80 backdrop-blur-xl border-b border-white/5">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high transition-colors text-on-surface-variant border border-white/5">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="ml-4 font-title-lg text-title-lg text-on-surface">Login</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full max-w-max-width-container mx-auto px-md py-xl flex flex-col relative">
<!-- Background Decor -->
<div class="absolute top-0 right-0 w-64 h-64 bg-primary-container/10 rounded-full blur-[80px] -z-10 pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-48 h-48 bg-secondary-container/5 rounded-full blur-[60px] -z-10 pointer-events-none"></div>
<div class="flex-grow flex flex-col justify-center">
<div class="mb-lg">
<h1 class="font-display-lg text-display-lg text-on-surface mb-sm">Welcome back</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Enter your mobile number to get an OTP and access your refreshing juices.</p>
</div>
<!-- Input Group Glassmorphism -->
<div class="relative bg-surface-container-low/60 backdrop-blur-2xl rounded-xl p-6 border border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.4)] flex flex-col gap-sm">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1" for="mobile_number">Mobile Number</label>
<div class="flex gap-sm">
<!-- Country Code Selector -->
<button class="flex-shrink-0 flex items-center gap-2 bg-[#1c211e] border border-white/10 rounded-lg px-4 h-14 hover:border-primary-container transition-colors group">
<span class="font-body-lg text-body-lg text-on-surface group-hover:text-primary-container transition-colors">+91</span>
<span class="material-symbols-outlined text-on-surface-variant text-sm" data-icon="expand_more">expand_more</span>
</button>
<!-- Number Input -->
<div class="flex-grow relative">
<input class="w-full h-14 bg-[#1c211e] border border-white/10 rounded-lg px-4 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="mobile_number" maxlength="10" pattern="[0-9]{10}" placeholder="00000 00000" type="tel"/>
</div>
</div>
<div class="mt-xs text-center">
<p class="font-body-md text-body-md text-on-surface-variant/70 text-[12px]">By continuing, you agree to our <a class="text-primary hover:underline" href="#">Terms of Service</a> &amp; <a class="text-primary hover:underline" href="#">Privacy Policy</a>.</p>
</div>
</div>
<div class="mt-xl h-24"></div> <!-- Spacer -->
</div>
<!-- Sticky Bottom Action -->
<div class="sticky bottom-0 pb-lg pt-4 bg-gradient-to-t from-background via-background to-transparent z-40">
<button class="w-full h-14 bg-primary-container rounded-lg font-title-lg text-title-lg text-white shadow-[0_0_20px_rgba(249,115,22,0.45)] hover:bg-primary-container/90 hover:scale-[0.98] transition-all flex items-center justify-center gap-2 relative overflow-hidden group">
<span class="relative z-10">Send OTP</span>
<span class="material-symbols-outlined relative z-10" data-icon="arrow_forward">arrow_forward</span>
<div class="absolute inset-0 bg-white/20 opacity-0 group-active:opacity-100 transition-opacity z-0"></div>
</button>
</div>
