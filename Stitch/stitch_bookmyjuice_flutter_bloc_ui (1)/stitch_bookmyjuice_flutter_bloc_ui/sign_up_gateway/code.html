<script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabSignin = document.getElementById('tab-signin');
            const tabSignup = document.getElementById('tab-signup');
            const contentSignin = document.getElementById('content-signin');
            const contentSignup = document.getElementById('content-signup');

            const activeTabClasses = ['bg-surface-container', 'text-on-surface', 'shadow-md'];
            const inactiveTabClasses = ['text-on-surface-variant', 'hover:text-on-surface', 'bg-transparent', 'shadow-none'];

            function switchTab(isSignIn) {
                if (isSignIn) {
                    // Update buttons
                    tabSignin.setAttribute('aria-selected', 'true');
                    tabSignup.setAttribute('aria-selected', 'false');
                    
                    tabSignin.classList.add(...activeTabClasses);
                    tabSignin.classList.remove(...inactiveTabClasses);
                    
                    tabSignup.classList.add(...inactiveTabClasses);
                    tabSignup.classList.remove(...activeTabClasses);

                    // Update content
                    contentSignup.classList.remove('active');
                    setTimeout(() => {
                        contentSignin.classList.add('active');
                    }, 50);

                } else {
                    // Update buttons
                    tabSignup.setAttribute('aria-selected', 'true');
                    tabSignin.setAttribute('aria-selected', 'false');
                    
                    tabSignup.classList.add(...activeTabClasses);
                    tabSignup.classList.remove(...inactiveTabClasses);
                    
                    tabSignin.classList.add(...inactiveTabClasses);
                    tabSignin.classList.remove(...activeTabClasses);

                    // Update content
                    contentSignin.classList.remove('active');
                    setTimeout(() => {
                        contentSignup.classList.add('active');
                    }, 50);
                }
            }

            tabSignin.addEventListener('click', () => switchTab(true));
            tabSignup.addEventListener('click', () => switchTab(false));
        });
    </script>
